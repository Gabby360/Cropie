<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Cropie</title>
  <meta name="description" content="Reset your Cropie password to regain access to your farm dashboard and daily recommendations." />

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="auth-page-body">

  <!-- AUTH HEADER NAVBAR -->
  <header class="auth-header">
    <div class="container auth-header-inner">
      <a href="/" class="brand-logo">
        <div class="logo-icon">
          <i class="fa-solid fa-seedling"></i>
        </div>
        <span>Cropie</span>
      </a>
      <a href="/login.html" class="btn btn-outline-sm">Back to Sign In</a>
    </div>
  </header>

  <!-- AUTH MAIN CONTAINER -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Enter your registered email address to receive password reset instructions.</p>
      </div>

      <!-- ALERT BANNER -->
      <div id="authAlertBanner" class="auth-alert-banner" style="display: none;"></div>

      <form id="resetForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="resetInput" class="form-label">Email Address</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input 
              type="email" 
              id="resetInput" 
              class="form-input" 
              placeholder="Enter your registered email address" 
              required 
            />
          </div>
          <span class="field-error-msg" id="resetError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="resetSubmitBtn">
          <span id="resetBtnText">Send Reset Instructions</span>
          <i class="fa-solid fa-paper-plane btn-icon-right"></i>
        </button>
      </form>

      <div class="auth-card-footer">
        <p>Remembered your password? <a href="/login.html" class="auth-link-bold">Sign in</a></p>
      </div>
    </div>
  </main>

  <script type="module">
    import { CropieAuthService } from '/src/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      const auth = new CropieAuthService();
      const form = document.getElementById('resetForm');
      const resetInput = document.getElementById('resetInput');
      const alertBanner = document.getElementById('authAlertBanner');
      const submitBtn = document.getElementById('resetSubmitBtn');
      const btnText = document.getElementById('resetBtnText');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        showAlert(null);

        const email = resetInput.value.trim();

        if (!email) {
          showFieldError('resetError', 'Please enter your registered email address.');
          return;
        }

        submitBtn.disabled = true;
        btnText.textContent = 'Sending...';

        try {
          const res = await auth.requestPasswordReset(email);
          showAlert(res.message, 'success');
          form.reset();
        } catch (err) {
          showAlert(err.message || 'Unable to send reset instructions.', 'error');
        } finally {
          submitBtn.disabled = false;
          btnText.textContent = 'Send Reset Instructions';
        }
      });

      function showFieldError(id, msg) {
        const el = document.getElementById(id);
        if (el) el.textContent = msg;
      }

      function showAlert(msg, type = 'error') {
        if (!msg) {
          alertBanner.style.display = 'none';
          return;
        }
        alertBanner.className = `auth-alert-banner ${type}`;
        alertBanner.textContent = msg;
        alertBanner.style.display = 'block';
      }
    });
  </script>
</body>
</html>
