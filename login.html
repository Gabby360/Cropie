<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Cropie</title>
  <meta name="description" content="Sign in to your Cropie account to access personalized weather alerts, growth stage updates, and verified agricultural guidance." />

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="auth-page-body">

  <!-- AUTH HEADER NAVBAR -->
  <header class="auth-header">
    <div class="container auth-header-inner">
      <a href="/" class="brand-logo">
        <div class="logo-icon">
          <i class="fa-solid fa-seedling"></i>
        </div>
        <span>Cropie</span>
      </a>
      <a href="/signup.html" class="btn btn-outline-sm">Create Account</a>
    </div>
  </header>

  <!-- AUTH MAIN CONTAINER -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1 class="auth-title">Welcome back</h1>
      </div>

      <!-- ERROR / SUCCESS ALERT BANNER -->
      <div id="authAlertBanner" class="auth-alert-banner" style="display: none;"></div>

      <form id="loginForm" class="auth-form" novalidate>
        <!-- EMAIL ADDRESS -->
        <div class="form-group">
          <label for="emailOrPhone" class="form-label">Email Address</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input 
              type="email" 
              id="emailOrPhone" 
              class="form-input" 
              placeholder="Enter your email address" 
              required 
            />
          </div>
          <span class="field-error-msg" id="emailOrPhoneError"></span>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input 
              type="password" 
              id="loginPassword" 
              class="form-input" 
              placeholder="Enter your password" 
              required 
            />
            <button type="button" class="btn-toggle-password" id="togglePasswordBtn" title="Toggle Password Visibility">
              <i class="fa-regular fa-eye" id="passwordEyeIcon"></i>
            </button>
          </div>
          <span class="field-error-msg" id="passwordError"></span>
        </div>

        <!-- OPTIONS: REMEMBER ME & FORGOT PASSWORD -->
        <div class="auth-options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMeCheckbox" checked />
            <span>Remember me</span>
          </label>
          <a href="/forgot-password.html" class="auth-link-sm">Forgot password?</a>
        </div>

        <!-- SUBMIT BUTTON -->
        <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
          <span id="loginBtnText">Sign In</span>
          <i class="fa-solid fa-arrow-right btn-icon-right"></i>
        </button>
      </form>

      <div class="auth-card-footer">
        <p>Don't have a Cropie account? <a href="/signup.html" class="auth-link-bold">Create an account</a></p>
      </div>
    </div>
  </main>

  <script type="module">
    import { CropieAuthService } from '/src/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = new CropieAuthService();
      await auth.redirectIfAuthenticated('/dashboard.html');
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('emailOrPhone');
      const passwordInput = document.getElementById('loginPassword');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const passwordEyeIcon = document.getElementById('passwordEyeIcon');
      const alertBanner = document.getElementById('authAlertBanner');
      const submitBtn = document.getElementById('loginSubmitBtn');
      const btnText = document.getElementById('loginBtnText');

      // Password visibility toggle
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        passwordEyeIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
      });

      // Clear errors on typing
      emailInput.addEventListener('input', () => hideError('emailOrPhoneError'));
      passwordInput.addEventListener('input', () => hideError('passwordError'));

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        showAlert(null);

        const emailOrPhone = emailInput.value.trim();
        const password = passwordInput.value;
        const rememberMe = document.getElementById('rememberMeCheckbox').checked;

        let hasError = false;

        if (!emailOrPhone) {
          showFieldError('emailOrPhoneError', 'Please enter your email or phone number.');
          hasError = true;
        }

        if (!password) {
          showFieldError('passwordError', 'Please enter your password.');
          hasError = true;
        }

        if (hasError) return;

        // Set Loading State
        submitBtn.disabled = true;
        btnText.textContent = 'Signing you in...';

        try {
          const res = await auth.loginUser({ emailOrPhone, password, rememberMe });
          
          showAlert(res.message, 'success');

          setTimeout(() => {
            if (res.hasFarm) {
              window.location.href = '/dashboard.html';
            } else {
              window.location.href = '/farm-setup.html';
            }
          }, 400);

        } catch (err) {
          submitBtn.disabled = false;
          btnText.textContent = 'Sign In';
          showAlert(err.message || 'Incorrect email or password.', 'error');
        }
      });

      function showFieldError(id, msg) {
        const el = document.getElementById(id);
        if (el) el.textContent = msg;
      }

      function hideError(id) {
        const el = document.getElementById(id);
        if (el) el.textContent = '';
      }

      function showAlert(msg, type = 'error') {
        if (!msg) {
          alertBanner.style.display = 'none';
          return;
        }
        alertBanner.className = `auth-alert-banner ${type}`;
        alertBanner.textContent = msg;
        alertBanner.style.display = 'block';
      }
    });
  </script>
</body>
</html>
